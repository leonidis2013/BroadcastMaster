name: Build BroadcastMaster

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Metering and DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metering tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -ISource/Meters Tests/MeterTests.cpp -o meter_tests
          ./meter_tests
      - name: DSP module tests (with address and undefined-behaviour sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -Wall -Wextra -ISource Tests/DspTests.cpp -o dsp_tests
          ./dsp_tests
      - name: Processing chain tests (with sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -Wall -Wextra -ISource Tests/ChainTests.cpp -o chain_tests
          ./chain_tests

  build:
    name: VST3 (${{ matrix.name }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target BroadcastMaster_VST3 --parallel

      - name: Locate the plugin
        id: locate
        shell: bash
        run: |
          VST3=$(find build -maxdepth 6 -name "BroadcastMaster.vst3" | head -n 1)
          echo "Found: $VST3"
          echo "path=$VST3" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "${{ steps.locate.outputs.path }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.locate.outputs.path }}" -DestinationPath BroadcastMaster-Windows-VST3.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ steps.locate.outputs.path }}" BroadcastMaster-macOS-VST3.zip

      - name: Read version from CMakeLists.txt
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^project(BroadcastMaster VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the Mac installer (.pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          installer/mac/build-pkg.sh "${{ steps.version.outputs.version }}" "${{ steps.locate.outputs.path }}" BroadcastMaster-macOS-Installer.pkg > pkg.log 2>&1
          status=$?
          cat pkg.log
          if [ $status -ne 0 ]; then tail -25 pkg.log | sed 's/^/::error::/'; fi
          exit $status

      - name: Build the Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $vst3 = (Resolve-Path "${{ steps.locate.outputs.path }}").Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceVst3=$vst3" "/DOutputDir=$PWD" installer\windows\BroadcastMaster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: BroadcastMaster-${{ matrix.name }}
          path: |
            BroadcastMaster-${{ matrix.name }}-VST3.zip
            BroadcastMaster-${{ matrix.name }}-Installer.*
          if-no-files-found: error

  release:
    name: Publish downloads
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          {
            echo "**BroadcastMaster** - built $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`"
            echo
            echo "### Mac: BroadcastMaster-macOS-Installer.pkg"
            echo "1. Quit LiveProfessor (or any host), download the installer and double-click it."
            echo "2. If macOS says it can't verify the installer: click **Done**, open **System Settings > Privacy & Security**, scroll down and click **Open Anyway** next to BroadcastMaster-macOS-Installer.pkg, then enter your password. (Needed once per download until the installer is signed with an Apple Developer ID.)"
            echo "3. Click through the installer. It removes old BroadcastMaster copies, installs into /Library/Audio/Plug-Ins/VST3 and clears the macOS download block - no Terminal command needed."
            echo "4. Reopen your host and rescan plug-ins."
            echo
            echo "### Windows: BroadcastMaster-Windows-Installer.exe"
            echo "1. Close your host, download the installer and run it."
            echo "2. If Windows shows **Windows protected your PC**, click **More info > Run anyway**, then **Yes** for administrator permission."
            echo "3. Click through. It removes old BroadcastMaster copies and installs into C:\\Program Files\\Common Files\\VST3. It can be removed later from Settings > Apps."
            echo "4. Reopen your host and rescan plug-ins."
            echo
            echo "The plain zips are here for manual installs."
          } > notes.md

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "BroadcastMaster $GITHUB_REF_NAME" --notes-file notes.md --latest=false
          else
            # rolling release holding the newest build from main (the older "latest" prerelease is retired)
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh release delete latest-build --cleanup-tag --yes 2>/dev/null || true
            gh release create latest-build dist/* --target "$GITHUB_SHA" --title "Latest build" --notes-file notes.md --latest
          fi
